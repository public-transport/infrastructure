apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lod-codefor-de-api
  namespace: app-releases
spec:
  chart:
    spec:
      chart: ./kubernetes/.charts/simple-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 5m
  values:
    image:
      repositoryWithRegistry: "ghcr.io/juliuste/lod.codefor.de-api" # {"$imagepolicy": "flux-system:lod-codefor-de-api-image-policy:name"}
      tag: "v1_980ca32_2026-10-07T02.33.03Z" # {"$imagepolicy": "flux-system:lod-codefor-de-api-image-policy:tag"}
    exposedPort: 8080
    environment:
      PORT: 8080
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 200m
        memory: 128Mi
    livenessProbe: false
    startupProbe: false
